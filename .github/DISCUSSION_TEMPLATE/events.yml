title: "[Event] "
body:
  - type: markdown
    attributes:
      value: |
        Announce a hack weekend, a reading group or a talk. A hack weekend is three days on one small specification problem. Say how someone joins and what to install first. Notes and results go in a reply afterwards.
  - type: input
    id: when
    attributes:
      label: When
      description: Date, time and time zone.
      placeholder: 2026-11-14 to 2026-11-16, starting 15:00 UTC
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: A link, or a place.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What it is
      description: The problem or topic, who it is for, and what to set up first.
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host
    validations:
      required: true
