# Every Proven-Commons repository: its custom properties and its topics, under the labelling standard
# (LABELS-STANDARD.md). `sync.py repos plan` shows what differs on GitHub; `repos apply` sets it. Owners only.
# A stage moves to verified only when the bar check passes with a separate reviewer.

version = 1
org = "Proven-Commons"
required_topics = ["proven-commons"]

[properties.kind]
type = "multi_select"
values = ["org-home", "core", "site", "library"]
description = "What the repository is"

[properties.domain]
type = "multi_select"
values = ["encodings", "data-formats", "archives", "network", "identifiers"]
description = "The area of the library, as the profile README groups them"

[properties.stage]
type = "single_select"
values = ["started", "spec-review", "verified"]
description = "How far it is along the path to the verified bar"

[properties.board]
type = "single_select"
values = ["main", "internal", "project", "none"]
description = "Its discussion board under the forum standard"

[properties.owner]
type = "string"
description = "The person or team who answers for it"

[[repos]]
name = ".github"
kind = ["org-home"]
board = "main"

[[repos]]
name = "mission"
kind = ["core", "site"]
board = "internal"
topics = ["formal-verification"]

